[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "psygen"
version = "0.1.0"
description = "Automated psytrance / goa / progressive track generator for Termux, exporting MIDI and WAV for FL Studio Mobile"
readme = "README.md"
requires-python = ">=3.10"
# Everything except `anthropic` is pure Python. anthropic pulls in
# pydantic-core and jiter, which need a Rust toolchain on Termux if pip
# finds no prebuilt wheel (see README).
dependencies = [
    "anthropic>=2.1",
    "mido>=1.3",
]

[project.optional-dependencies]
# numpy: install with `pkg install python-numpy` on Termux, not pip.
analysis = ["numpy>=1.24"]
# soundfile needs libsndfile (`pkg install libsndfile`); WAV works without it.
audio = ["numpy>=1.24", "soundfile>=0.12"]
dev = ["pytest>=7", "numpy>=1.24"]

[project.scripts]
psygen = "psygen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
